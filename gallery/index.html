    .full-gallery { width:min(1500px, calc(100% - 2rem)); margin:0 auto clamp(3rem,6vw,5rem); display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(.7rem,1.6vw,1.2rem); }

    .full-gallery__item img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s ease; }
    .full-gallery__item:hover img { transform:scale(1.035); }
    .lightbox { position:fixed; inset:0; z-index:99; display:none; align-items:center; justify-content:center; padding:1rem; background:rgba(0,0,0,.86); }
    .lightbox.active { display:flex; }
    .lightbox img { max-width:95vw; max-height:88vh; border-radius:14px; object-fit:contain; }
    .lightbox button { position:absolute; top:1rem; right:1rem; width:44px; height:44px; border:0; border-radius:999px; background:#fff; color:var(--green); font-size:1.5rem; cursor:pointer; }
    @media (max-width: 900px) { .full-gallery { grid-template-columns:repeat(2,minmax(0,1fr)); } .full-gallery__item:nth-child(7n+1) { grid-column:span 2; } .brand img { width:76px; } }

  <div class="lightbox" id="galleryLightbox" aria-hidden="true"><button type="button" aria-label="Close">&times;</button><img alt=""></div>
  <script>
    const lb = document.getElementById('galleryLightbox');
    const img = lb.querySelector('img');
    document.querySelectorAll('[data-full]').forEach((item) => {
      item.addEventListener('click', (event) => {
        event.preventDefault();
        img.src = item.dataset.full;
        img.alt = item.querySelector('img')?.alt || 'Meraki Hillside Villa photo';
        lb.classList.add('active');
        lb.setAttribute('aria-hidden', 'false');
      });
    });
    lb.addEventListener('click', () => { lb.classList.remove('active'); lb.setAttribute('aria-hidden', 'true'); img.src = ''; });
  </script>
